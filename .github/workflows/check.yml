name: Backend checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: infrapulse
          POSTGRES_PASSWORD: infrapulse_test
          POSTGRES_DB: infrapulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U infrapulse -d infrapulse_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CGO_ENABLED: "0"
      TEST_DATABASE_URL: postgres://infrapulse:infrapulse_test@127.0.0.1:5432/infrapulse_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Tests
        run: go test ./...
      - name: Format
        run: test -z "$(gofmt -l cmd internal api/proto)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o bin/infrapulse-backend ./cmd/server
      - name: Build Automation Worker
        run: go build -trimpath -o bin/infrapulse-automation-worker ./cmd/automation-worker
      - name: Python Runner adapter contract
        run: python3 -B scripts/test_automation_runner.py
      - name: Race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
