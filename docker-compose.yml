services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infrapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infrapulse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-infrapulse}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-infrapulse}:${POSTGRES_PASSWORD:-infrapulse_dev}@postgres:5432/${POSTGRES_DB:-infrapulse}?sslmode=disable
      HTTP_ADDRESS: 0.0.0.0:8080
      GRPC_ADDRESS: 0.0.0.0:9443
      AGENT_TIMEOUT: 90s
      DEFAULT_TELEPHONY_INTERVAL: ${DEFAULT_TELEPHONY_INTERVAL:-30s}
      AUTH_MODE: ${AUTH_MODE:-required}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-8h}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      COLLECTOR_CONFIG_ENABLED: ${COLLECTOR_CONFIG_ENABLED:-false}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-false}
      AUTOMATION_ENCRYPTION_KEY: ${AUTOMATION_ENCRYPTION_KEY:-}
      CONFIGURATION_DRIFT_MAX_AGE: ${CONFIGURATION_DRIFT_MAX_AGE:-15m}
      COMMANDS_ENABLED: ${COMMANDS_ENABLED:-false}
      COMMAND_ALLOW_DISABLE: ${COMMAND_ALLOW_DISABLE:-false}
      COMMAND_ALLOW_ROLLBACK: ${COMMAND_ALLOW_ROLLBACK:-false}
      COMMAND_PROTECTED_DEVICES: ${COMMAND_PROTECTED_DEVICES:-}
      COMMAND_PROTECTED_INTERFACES: ${COMMAND_PROTECTED_INTERFACES:-}
      HEALTH_CPU_WARNING: ${HEALTH_CPU_WARNING:-80}
      HEALTH_CPU_CRITICAL: ${HEALTH_CPU_CRITICAL:-95}
      HEALTH_CPU_RECOVERY: ${HEALTH_CPU_RECOVERY:-70}
      HEALTH_RAM_WARNING: ${HEALTH_RAM_WARNING:-80}
      HEALTH_RAM_CRITICAL: ${HEALTH_RAM_CRITICAL:-95}
      HEALTH_RAM_RECOVERY: ${HEALTH_RAM_RECOVERY:-75}
      HEALTH_FORECAST_HORIZON_SECONDS: ${HEALTH_FORECAST_HORIZON_SECONDS:-300}
      AI_ENABLED: ${AI_ENABLED:-false}
      DATA_SOURCE_ENCRYPTION_KEY: ${DATA_SOURCE_ENCRYPTION_KEY:-}
      DATA_SOURCE_ALLOWED_ORIGINS: ${DATA_SOURCE_ALLOWED_ORIGINS:-}
      DATA_SOURCE_ALLOWED_CIDRS: ${DATA_SOURCE_ALLOWED_CIDRS:-}
      DATA_SOURCE_ALLOW_LOOPBACK: ${DATA_SOURCE_ALLOW_LOOPBACK:-false}
      DATA_SOURCE_CA_FILES: ${DATA_SOURCE_CA_FILES:-}
      ASSET_AUTO_RESOLUTION_ENABLED: ${ASSET_AUTO_RESOLUTION_ENABLED:-false}
      ASSET_RESOLUTION_MAX_AGE: ${ASSET_RESOLUTION_MAX_AGE:-24h}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-45s}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${GRPC_PORT:-9443}:9443"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  postgres_data:
